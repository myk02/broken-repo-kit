name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev requirements
        run: python -m pip install -r requirements-dev.txt
      - name: Kit and base tests
        run: python -m pytest
      - name: Task quality gate
        run: python -m kit selftest --repeat 3

  docker:
    name: Docker (offline verification)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t broken-repo-kit .
      - name: Verify with no network
        run: docker run --rm --network none broken-repo-kit python -m kit selftest
